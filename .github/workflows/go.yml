name: Build
on:
  push:
    branches: ['master']
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test desktop and inventory server
        run: |
          go test ./...
          python3 -m unittest discover -s server/stock-log -p 'test_*.py'
      - name: Package universal Mac app
        run: python3 scripts/package_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: qiangnimei18-macos-universal
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
