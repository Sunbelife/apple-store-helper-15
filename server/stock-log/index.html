<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>抢你妹 · 库存记录</title>
<style>body{font:15px system-ui,sans-serif;background:#f6f7f9;color:#17202a;margin:0;padding:32px}main{max-width:1500px;margin:auto}h1{font-size:26px;margin-bottom:8px}p{color:#657080}form{display:flex;gap:10px;margin:24px 0}input{flex:1;max-width:550px;padding:12px;border:1px solid #cbd1d9;border-radius:8px}button{padding:10px 18px;border:1px solid #cbd1d9;background:white;border-radius:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.table{overflow:auto;background:white;border:1px solid #e0e4e9;border-radius:10px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid #edf0f3}th{background:#f9fafb}footer{display:flex;gap:16px;align-items:center;margin-top:18px}#status{margin-left:auto;color:#657080}</style>
<main><form method="post" action="/iphone-stock/logout" style="float:right;margin:0"><button>退出登录</button></form><h1>抢你妹 · 库存记录</h1><p>客户端检测到有货时提交的公开门店库存，仅供参考，不代表当前仍有库存。时间以北京时间显示。</p>
<form id="search"><input id="q" placeholder="搜索城市、门店、型号、容量、颜色或 SKU"><button>查询</button><button type="button" id="refresh">刷新</button></form>
<div class="table"><table><thead><tr><th>发现时间</th><th>地区 / 城市</th><th>门店</th><th>型号</th><th>容量</th><th>颜色</th><th>SKU</th><th>服务器接收时间</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer><button id="prev">上一页</button><span id="count"></span><button id="next">下一页</button><span id="status" role="status"></span></footer></main>
<script>
let page=1,total=0;const $=id=>document.getElementById(id);const time=v=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium',hour12:false}).format(new Date(v));
async function load(){ $('status').textContent='加载中…';try{const res=await fetch('/iphone-stock/api/events?'+new URLSearchParams({page,q:$('q').value}));if(!res.ok)throw Error('加载失败，请确认管理员登录状态');const data=await res.json();total=data.total;$('rows').replaceChildren();for(const e of data.events){const tr=document.createElement('tr');for(const value of [time(e.detected_at),[e.area,e.province,e.city].filter(Boolean).join(' / '),e.store_name,e.model,e.capacity,e.color,e.sku,time(e.received_at)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('rows').append(tr)}if(!data.events.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.textContent='暂无库存记录';tr.append(td);$('rows').append(tr)}$('count').textContent=`第 ${page} 页 · 共 ${total} 条`;$('prev').disabled=page<=1;$('next').disabled=page*50>=total;$('status').textContent='已更新 · '+time(new Date())}catch(e){$('status').textContent=e.message}}
$('search').onsubmit=e=>{e.preventDefault();page=1;load()};$('refresh').onclick=()=>load();$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page*50<total){page++;load()}};load();
</script></html>
