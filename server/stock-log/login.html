<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>库存记录 · 访问验证</title>
<style>
:root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #17191c; }
.card { width: min(420px, calc(100vw - 32px)); padding: 34px; background: #fff; border: 1px solid #e4e6ea; border-radius: 18px; box-shadow: 0 18px 60px rgba(20, 24, 32, .08); }
.mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: #17191c; color: #fff; font-size: 20px; margin-bottom: 22px; }
h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -.02em; }
p { color: #656a73; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
input { width: 100%; height: 48px; border: 1px solid #cfd3da; border-radius: 10px; padding: 0 14px; font-size: 16px; outline: none; }
input:focus { border-color: #17191c; box-shadow: 0 0 0 3px rgba(23,25,28,.08); }
button { width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 10px; background: #17191c; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
.error { color: #b42318; background: #fef3f2; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
</style>
</head>
<body><main class="card"><div class="mark">孙</div><h1>库存记录</h1><p>请输入访问密码后继续。验证成功后，本设备将在 12 小时内保持登录。</p>{error}<form action="/iphone-stock/login" method="post" autocomplete="off"><label for="password">访问密码</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"><button type="submit">进入库存后台</button></form></main></body>
</html>
